<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="260" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="16" fill="url(#grid)" opacity=".6"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#acc)"/>
  <!-- window dots -->
  <circle cx="40" cy="36" r="6" fill="#F87171"/><circle cx="60" cy="36" r="6" fill="#FBBF24"/><circle cx="80" cy="36" r="6" fill="#34D399"/>
  <text x="60" y="110" class="mono" font-size="18" fill="#64748B">~/AhmedGhazy-DEV $ whoami</text>
  <text x="60" y="170" class="mono" font-size="52" font-weight="700" fill="#F8FAFC">Ahmed Ghazy</text>
  <text x="60" y="215" class="mono" font-size="22" fill="url(#acc)">Software Engineer · Backend &amp; Agentic AI<tspan class="cur" fill="#34D399"> ▌</tspan></text>
</svg>
